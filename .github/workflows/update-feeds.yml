name: Update Stack Exchange feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-stack-exchange-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate feeds
        run: python generate.py
        env:
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}

      - name: Save generated feeds
        run: |
          git config user.name "Stack feed bot"
          git config user.email "stack-feed-bot@users.noreply.github.com"
          git add docs state
          if ! git diff --cached --quiet; then
            git commit -m "Update Stack Exchange feeds"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
